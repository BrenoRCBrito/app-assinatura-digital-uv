appId: com.brcb.AssinaAqui
---
- tapOn:
    below: "Código de autenticidade"
- inputText: ${CODIGO}
# Enter em vez de hideKeyboard: com o teclado do PC ligado no emulador, o Gboard vira uma barra flutuante que o
# hideKeyboard não fecha, e o "voltar" que ele tenta sai da tela. O Enter tira o foco do campo e fecha o teclado.
- pressKey: Enter
- tapOn: "Conferir"
# O app espera até 60 s pela API: no plano grátis do Render ela pode estar acordando.
- extendedWaitUntil:
    notVisible: "Conferir"
    timeout: 60000
- runFlow:
    when:
      visible: "Servidor indisponível"
    commands:
      # Só o APK de desenvolvimento mostra o campo do endereço; o de entrega usa sempre a API do build.
      - runFlow:
          when:
            visible: "Endereço da API"
          commands:
            - tapOn:
                below: "Endereço da API"
            - eraseText: 60
            - inputText: ${API_URL}
            - pressKey: Enter
      - tapOn: "Tentar de novo"
